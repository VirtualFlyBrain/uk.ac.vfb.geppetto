# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Create stub artifacts for missing Spring Source dependencies
      run: |
        mkdir -p $HOME/.m2/repository/org/apache/log4j/com.springsource.org.apache.log4j/1.2.15
        mkdir -p $HOME/.m2/repository/org/junit/com.springsource.org.junit/4.7.0
        mkdir -p $HOME/.m2/repository/org/easymock/com.springsource.org.easymock/2.3.0
        # Create minimal valid JAR files (empty JARs with manifest)
        cd /tmp
        mkdir -p stub
        cd stub
        mkdir -p META-INF
        echo "Manifest-Version: 1.0" > META-INF/MANIFEST.MF
        jar cfm log4j-stub.jar META-INF/MANIFEST.MF
        jar cfm junit-stub.jar META-INF/MANIFEST.MF
        jar cfm easymock-stub.jar META-INF/MANIFEST.MF
        cp log4j-stub.jar $HOME/.m2/repository/org/apache/log4j/com.springsource.org.apache.log4j/1.2.15/com.springsource.org.apache.log4j-1.2.15.jar
        cp junit-stub.jar $HOME/.m2/repository/org/junit/com.springsource.org.junit/4.7.0/com.springsource.org.junit-4.7.0.jar
        cp easymock-stub.jar $HOME/.m2/repository/org/easymock/com.springsource.org.easymock/2.3.0/com.springsource.org.easymock-2.3.0.jar
    - name: Setup security
      run: mvn --encrypt-master-password 1234
    - name: Build model
      run: | 
          git clone https://github.com/openworm/org.geppetto.model.git
          cd org.geppetto.model
          git checkout vfb_20200604_a
          export LOG4J_FORMAT_MSG_NO_LOOKUPS=true
          npm install jest@24.8.0 jest-image-snapshot@4.1.0 puppeteer@1.17.0 jest-puppeteer@4.3.0 @babel/preset-env@7.4.5 url-join@4.0.0 @babel/core@7.4.5
          mvn -X -U -Dhttps.protocols=TLSv1.2 -Dmaven.test.skip=true --file pom.xml install -nsu -s ../.mvn/settings.xml
    - name: Build core
      run: | 
          git clone https://github.com/openworm/org.geppetto.core.git
          cd org.geppetto.core
          git checkout VFBv2.2.0
          mvn -Dhttps.protocols=TLSv1.2 -Dmaven.test.skip=true install -s ../.mvn/settings.xml
    - name: Build simulation
      run: | 
          git clone https://github.com/openworm/org.geppetto.simulation.git
          cd org.geppetto.simulation
          git checkout VFBv2.1.0.2
          mvn -Dhttps.protocols=TLSv1.2 -Dmaven.test.skip=true install -s ../.mvn/settings.xml
    - name: Build datasources
      run: | 
          git clone https://github.com/openworm/org.geppetto.datasources.git
          cd org.geppetto.datasources
          git checkout passingSOLR
          mvn -Dhttps.protocols=TLSv1.2 -Dmaven.test.skip=true install -s ../.mvn/settings.xml
    - name: Build uk.ac.vfb.geppetto
      run: mvn -B package --file pom.xml -s .mvn/settings.xml
      
    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

